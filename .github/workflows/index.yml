name: index

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore previous snapshot
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" data
            rm -rf data/.git
          else
            mkdir -p data
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Index Arc Mainnet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          NOTIFY_NETS: mainnet
          NOTIFY_KINDS: anomaly
          # Wallet index on mainnet stays off until the repository variable WALLET_INDEX_MAINNET is set to 1.
          WALLET_INDEX: ${{ vars.WALLET_INDEX_MAINNET }}
        run: NET=mainnet BUDGET_SECONDS=1200 node src/run.mjs && NET=mainnet node src/summarize.mjs && NET=mainnet node src/supply.mjs && NET=mainnet node src/label.mjs && NET=mainnet node src/extras.mjs

      - name: Index Arc Testnet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          NOTIFY_NETS: testnet
          NOTIFY_KINDS: anomaly,daily,health,rank,contract,agents,weekly
          WALLET_INDEX: '1'
        run: NET=testnet BUDGET_SECONDS=300 BACKFILL_HOURS=24 node src/run.mjs && NET=testnet node src/summarize.mjs && NET=testnet node src/supply.mjs && NET=testnet node src/label.mjs && NET=testnet node src/extras.mjs

      # Daily: merge closed UTC days of the wallet index into the `wallets-testnet` branch. Cheap no-op otherwise.
      - name: Publish wallet index (testnet)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-wallets.sh testnet

      # Mainnet: only after the history backfill has finished (workflow wallet-backfill) and the variable is set.
      - name: Publish wallet index (mainnet)
        if: ${{ vars.WALLET_PUBLISH_MAINNET == '1' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/publish-wallets.sh mainnet

      - name: Publish snapshot
        run: ./scripts/publish.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub runs the 5-minute cron only every few hours, so each run starts the next one itself.
      # `always()` keeps the loop alive when indexing fails; the cron above restarts it if it ever breaks.
      # The next run waits in the `index` concurrency group until this one ends, so runs never overlap.
      - name: Start the next run
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 420
          gh workflow run index.yml --ref "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"

name: telegram-test

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send a test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" -d "text=Pulsarc alerts are connected. Anomalies, daily summaries and network health will be posted here.")
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('/tmp/out.json'));print({k:d.get(k) for k in ('ok','error_code','description')})"
          test "$code" = 200
